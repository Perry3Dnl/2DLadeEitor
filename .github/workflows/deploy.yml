name: Deploy drawer editor
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 2dladeeditor-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_FINGERPRINT: ${{ vars.DEPLOY_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build static site
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run typecheck
          npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      - name: Install SSH tooling and verify known host
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PASSWORD:?Missing DEPLOY_PASSWORD secret}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          if [ -n "$DEPLOY_FINGERPRINT" ]; then
            actual=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1{print $2}')
            test "$actual" = "$DEPLOY_FINGERPRINT" || { echo "SSH host fingerprint mismatch"; exit 1; }
          fi
      - name: Upload static site and deployment definition
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/2dladeeditor-deploy.tar.gz out Dockerfile docker-compose.yml deploy
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/2dladeeditor'
          sshpass -e scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes /tmp/2dladeeditor-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/2dladeeditor/source.tar.gz"
      - name: Deploy with collision and Caddy preflight
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASSWORD"
          sshpass -e ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/remote-deploy.sh
      - name: Verify public route and deployed revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse --short=8 HEAD)"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --connect-timeout 8 --max-time 15 "https://lade.perry3d.nl/?verify=${revision}" > /tmp/lade-live.html && grep -q "$revision" /tmp/lade-live.html; then
              echo "Live revision verified: $revision at https://lade.perry3d.nl"
              exit 0
            fi
            sleep 10
          done
          echo "Public route does not yet serve expected revision; inspect DNS and shared Caddy logs" >&2
          exit 1
